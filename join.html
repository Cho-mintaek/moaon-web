<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모아온 초대장</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
         background:#FFF9F3; color:#3D2620; display:flex; min-height:100vh; align-items:center; justify-content:center; }
  .card { text-align:center; padding:40px 28px; max-width:360px; }
  .heart { font-size:44px; }
  h1 { font-size:22px; margin:14px 0 6px; }
  p { font-size:14px; color:#8A7B75; line-height:1.7; margin:0 0 22px; }
  .code { font-size:30px; font-weight:800; letter-spacing:6px; color:#E2547A;
          background:#fff; border:1.5px solid #F0E4DD; border-radius:16px; padding:14px 10px; margin:0 0 20px; }
  a.btn { display:block; background:#E2547A; color:#fff; text-decoration:none; font-weight:800;
          border-radius:999px; padding:15px 0; font-size:15px; margin-bottom:10px; }
  a.ghost { display:block; color:#8A7B75; text-decoration:none; font-size:13px; padding:10px 0; }
  .tip { font-size:11.5px; color:#B9A9A2; margin-top:18px; line-height:1.6; }
</style>
</head>
<body>
<div class="card">
  <div class="heart">💌</div>
  <h1>모아온 초대장이 도착했어요</h1>
  <p>둘이 모아가는 하루 — 연인이 우리만의 공간에<br>당신을 초대했어요.</p>
  <div class="code" id="code">······</div>
  <a class="btn" id="open" href="#">앱에서 초대 받기</a>
  <a class="ghost" href="https://play.google.com/store/apps/details?id=app.moaon">Google Play에서 설치</a>
  <a class="ghost" href="https://apps.apple.com/kr/search?term=%EB%AA%A8%EC%95%84%EC%98%A8">App Store에서 '모아온' 검색</a>
  <div class="tip">앱 설치 후 이 링크를 다시 누르거나,<br>'초대코드를 받았어요'에 위 코드를 입력하면 연결돼요.</div>
</div>
<script>
  var code = (new URLSearchParams(location.search).get('code') || '').replace(/[^A-Za-z0-9]/g, '').toUpperCase().slice(0, 6);
  if (code) {
    document.getElementById('code').textContent = code;
    document.getElementById('open').href = 'moaon:///join?code=' + code;
  } else {
    document.getElementById('code').style.display = 'none';
    document.getElementById('open').href = 'moaon:///join';
  }
</script>
</body>
</html>
